<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TradeNova</title>

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <div class="signup-container">

        <div class="logo">
            Trade<span>Nova</span>
        </div>

        <div class="demo-badge">
            DEMO PLATFORM
        </div>

        <h1>Create account</h1>
        <p class="subtitle">Create your TradeNova demo account</p>

        <form id="signupForm">

            <div class="input-group">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button type="button" id="showPassword">
                        Show
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button type="button" id="showConfirmPassword">
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="signup-button">
                Create Account
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Log In</a>
        </p>

        <p class="demo-note">
            This is a simulated demo platform. Do not use real passwords.
        </p>

    </div>

    <script src="signup.js"></script>

</body>
</html>
